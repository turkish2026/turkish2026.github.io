<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>

<body>

    <div class="container">

<div class="classSelector">
  <label for="schoolClass">
    Öğrencinin sınıfını seçin:
  </label>

  <select id="schoolClass">
    <option value="1">1. sınıf</option>
    <option value="2">2. sınıf</option>
    <option value="3">3. sınıf</option>
    <option value="4">4. sınıf</option>
    <option value="5" selected>5. sınıf</option>
    <option value="6">6. sınıf</option>
    <option value="7">7. sınıf</option>
    <option value="8">8. sınıf</option>
    <option value="9">9. sınıf</option>
    <option value="10">10. sınıf</option>
    <option value="11">11. sınıf</option>
    <option value="12">12. sınıf</option>
  </select>
</div>

        Rumence öğreniyoruz!
        <div class=" spacer"></div>
        <textarea id="textInput" placeholder="Burada sizin tarafınızdan konuşulan metni göreceksiniz"></textarea>
        <div class=" spacer"></div>
        <button id="sendButton" onclick="speech()">Bir şey mi söylemek istiyorsun? Buraya tıklayın ve konuşun</button>
        <div class=" spacer"></div>
        <textarea id="textOutput" placeholder="Burada Yapay Zekanın (YZ) telaffuz ettiği cevabı göreceksiniz."></textarea>
        <div class=" spacer"></div>
        <button onclick="repeatLast()">Yapay zeka tarafından telaffuz edilen cevabı tekrar dinlemek istiyorsanız - burayı tıklayın</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>
</html>
